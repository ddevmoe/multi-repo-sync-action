[project]
name = "multi-repo-sync-action"
version = "0.0.1"
description = "The multi-repo-sync GitHub action code base - Sync multiple files from source repository to multiple targets using PRs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pygithub>=2.8.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.3",
]
